<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Xcode MCP bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- hammer: Xcode's own mark -->
  <g fill="#FFFFFF">
    <rect x="46" y="30" width="40" height="17" rx="4" transform="rotate(-40 66 38.5)"/>
    <rect x="59" y="47" width="12" height="52" rx="5" transform="rotate(-40 65 73)"/>
  </g>

  <!-- bridge: the MCP link underneath -->
  <g stroke="#BFDBFE" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M30 104 h68"/>
    <path d="M40 104 v-9 M64 104 v-9 M88 104 v-9"/>
  </g>
</svg>
